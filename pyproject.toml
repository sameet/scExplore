[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scexplore"
version = "0.1.0"
description = "Interactive browser application for exploring single-cell RNA-Seq experiments (.rds, .h5, .h5ad) with UMAP, PHATE, module scores, and violin plots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "scExplore Contributors" }
]
dependencies = [
    "streamlit>=1.38.0",
    "scanpy>=1.10.0",
    "anndata>=0.10.0",
    "plotly>=5.20.0",
    "phate>=1.0.11",
    "umap-learn>=0.5.5",
    "h5py>=3.10.0",
    "rds2py>=0.6.0",
    "singlecellexperiment>=0.4.0",
    "summarizedexperiment>=0.4.0",
    "biocframe>=0.5.0",
    "delayedarray>=0.4.0",
    "hdf5array>=0.4.0",
    "multiassayexperiment>=0.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
scexplore = "scexplore.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scexplore*"]
